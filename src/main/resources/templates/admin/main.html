<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">  <!-- layout.html을 기본 템플릿으로 사용 -->
<head>
    <title>메인 페이지</title>
</head>
<body>
    <!-- content 영역만 정의 -->
    <div layout:fragment="content">
        <div class="dashboard-card">
            <div id="myGrid" class="ag-theme-alpine" style="height: 500px; width: 100%;"></div>
        </div>
    </div>

    <!-- 페이지별 추가 스크립트 -->
    <th:block layout:fragment="script">
        <script type="module" src="/js/common/ag-sample.js"></script>
        <script src="/js/common/data.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                console.log('메인 페이지가 로드되었습니다.');
            });
        </script>
    </th:block>
</body>
</html>
