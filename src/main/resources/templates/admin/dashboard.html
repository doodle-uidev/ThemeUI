<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DashBoard</title>

    <!-- 공통 스타일 포함 -->
    <th:block th:replace="fragments/css :: css"></th:block>
    
  </head>
  <body>
    <!-- GNB (Global Navigation Bar) -->
    <header class="p-4 gnb">
      <div class="flex items-center justify-between h-full">
        <div class="flex items-center">
          <div class="header-title-block">
            <a href=""><h1 class="text-blue-700 pr-title">WINHUB</h1></a>
            <!-- <p>project small text </p> -->
          </div>
          <button id="toggleSidebar" data-tooltip-target="tooltip-menu-fold" data-tooltip-style="light" data-tooltip-placement="right" class="p-2 text-gray-400 toggle-btn">
            <i class="fas fa-bars"></i>
          </button>
          <div id="tooltip-menu-fold" role="tooltip" class="absolute invisible inline-block px-3 py-2 text-sm font-medium text-gray-900 bg-white border border-gray-200 rounded-lg shadow-sm opacity-0 z-1000 tooltip">
            메뉴 접기
            <div class="tooltip-arrow" data-popper-arrow></div>
          </div>
        </div>
         
        <div class="flex items-center gap-2">
          <!-- GNB-search -->
          <form class="max-w-md mx-auto">
            <label for="default-search" class="mb-2 text-sm font-medium text-gray-900 sr-only dark:text-white">Search</label>
            <div class="relative gnb-search">
              <div class="absolute inset-y-0 flex items-center pointer-events-none start-0 ps-3">
                <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
                </svg>
              </div>
              <input type="search" id="default-search" class="block w-full p-2 text-sm text-gray-900 border border-gray-300 rounded-lg ps-10 bg-gray-50 focus:ring-blue-500 focus:border-blue-700 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Search.." required />
              <!-- <button
                type="submit"
                class="text-white absolute end-1.5 bottom-1.5 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-1 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
              >
                검색
              </button> -->
            </div>
          </form>
          <div class="flex items-center mr-2 user-info">
            <i class="fa-regular fa-bell"></i>
            <!-- <img class="w-10 h-10 ml-3 rounded-full" src="/docs/images/people/profile-picture-5.jpg" alt="Rounded avatar"> -->
            <div class="ml-3">
              <span class="ml-1 font-bold text-blue-700"> James</span>
              <span class="ml-1 text-sm"> 12.25 11:20</span>
            </div>
          </div>
          <div class="flex items-center gap-2 gnb-btn-group">
            <button class="button-type-gnb">
              <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
            <button class="px-2 py-1 bg-gray-100 border border-gray-200 rounded-md hover:bg-gray-200 hover:border-gray-200 focus:outline-none focus:ring-4 focus:ring-gray-300">
              <i class="fa-solid fa-gear"></i>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="wrapper">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <header class="sidebar-header p-3 flex justify-between items-center border-b">
          <h2 class="text-lg font-bold">Project Name</h2>
          <div class="flex gap-2">
            <button class="px-2 py-1 bg-gray-100 border border-gray-200 rounded-md hover:bg-blue-100 hover:border-blue-200 focus:outline-none focus:ring-4 focus:ring-blue-300">
              <i class="fa-solid fa-house"></i>
            </button>
          </div>
        </header>

        <!-- Navigation -->
        <nav id="dynamicMenu">
          <!-- 메뉴가 JavaScript로 렌더링됩니다. -->
        </nav>

        <!-- Recent Activity -->
        <section class="p-4 mt-4">
          <h3 class="mb-3 text-gray-500">최근 활동</h3>
          <div class="flex items-center mb-3">
            <div class="p-2 mr-2 rounded">
              <i class="fa-solid fa-window-maximize"></i>
            </div>
            <p class="text-sm text-gray-500">5분 전</p>
          </div>
        </section>
      </aside>

      <!-- Main Content -->
      <div th:replace="fragments/content :: content"></div>
      
    </div>

    <!-- 공통 스크립트 포함 -->
    <th:block th:replace="fragments/scripts :: scripts"></th:block>
  </body>
</html>
