            <div class="flex flex-col gap-4 md:flex-row">
                <!-- 왼쪽 그리드 (마스터) -->
                <div class="flex-1">
                    <div class="card">
                        <div class="card-header flex justify-between items-center mb-3">
                            <h5 class="mb-0">Role List</h5>
                            <div class="flex gap-2">
                                <button type="button" id="addRoleBtn" class="px-4 py-2 text-sm bg-white text-gray-800 border border-gray-300 hover:text-blue-600 hover:bg-gray-100 hover:border-gray-200 focus:ring-3 focus:ring-gray-200 dark:focus:ring-blue-800 rounded-sm">
                                    <i class="mr-2 fas fa-plus"></i>추가
                                </button>
                                <button type="button" id="deleteRoleBtn" class="px-4 py-2 text-sm bg-white text-gray-800 border border-gray-300 hover:text-blue-600 hover:bg-gray-100 hover:border-gray-200 focus:ring-3 focus:ring-gray-200 dark:focus:ring-blue-800 rounded-sm">
                                    <i class="mr-2 fas fa-minus"></i>삭제
                                </button>
                                <button type="button" id="saveRoleBtn" class="px-4 py-2 text-sm bg-blue-600 text-white border border-blue-500 hover:bg-blue-600 hover:border-blue-600 focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-800 rounded-sm">
                                    <i class="mr-2 fas fa-save"></i>저장
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div id="roleGrid" class="ag-theme-alpine w-full h-[700px]"></div>
                        </div>
                    </div>
                </div>

                <!-- 오른쪽 그리드 (디테일) -->
                <div class="flex-1">
                    <div class="card">
                        <div class="card-header flex justify-between items-center mb-3">
                            <h5 class="mb-0">Role Permissions</h5>
                            <div class="flex gap-2">
                                <button type="button" id="addPermissionBtn" class="px-4 py-2 text-sm bg-white text-gray-800 border border-gray-300 hover:text-blue-600 hover:bg-gray-100 hover:border-gray-200 focus:ring-3 focus:ring-gray-200 dark:focus:ring-blue-800 rounded-sm">
                                    <i class="mr-2 fas fa-plus"></i>추가
                                </button>
                                <button type="button" id="deletePermissionBtn" class="px-4 py-2 text-sm bg-white text-gray-800 border border-gray-300 hover:text-blue-600 hover:bg-gray-100 hover:border-gray-200 focus:ring-3 focus:ring-gray-200 dark:focus:ring-blue-800 rounded-sm">
                                    <i class="mr-2 fas fa-minus"></i>삭제
                                </button>
                                <button type="button" id="savePermissionBtn" class="px-4 py-2 text-sm bg-blue-600 text-white border border-blue-500 hover:bg-blue-600 hover:border-blue-600 focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-800 rounded-sm">
                                    <i class="mr-2 fas fa-save"></i>저장
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div id="permissionGrid" class="ag-theme-alpine w-full h-[700px]"></div>
                        </div>
                    </div>
                </div>
